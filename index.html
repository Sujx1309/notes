<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lecture Notes</title>
<meta name="theme-color" content="#5C3030">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235C3030'/%3E%3Cpath d='M10 9h12a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1Z' fill='none' stroke='white' stroke-width='1.6'/%3E%3Cpath d='M13 14h6M13 18h4' stroke='white' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Sora:wght@400;500;600&family=Hind+Vadodara:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#f9fafb;font-family:'Sora','Hind Vadodara',sans-serif}
input,button,textarea{font-family:inherit}
button{cursor:pointer}
input:focus,textarea:focus{border-color:#5C3030!important;box-shadow:0 0 0 2px rgba(92,48,48,.15)}
</style>
</head>
<body class="text-gray-900 leading-tight">
<div id="app" class="w-full max-w-[1000px] mx-auto px-3 pt-4 pb-24"></div>
<script>
const P={plus:'M5 12h14M12 5v14',x:'M18 6 6 18M6 6l12 12',back:'m15 18-6-6 6-6',next:'m9 18 6-6-6-6',edit:'M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z',trash:'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6',search:'m21 21-4.3-4.3M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z',arrow:'M5 12h14m-6-6 6 6-6 6'};
const I=(n,c='w-4 h-4')=>`<svg class="${c} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;
const LS='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" class="w-9 h-9"><rect width="32" height="32" rx="7" fill="#5C3030"/><path d="M10 9h12a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1Z" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M13 14h6M13 18h4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>';
const LOGO='<span class="shrink-0">'+LS+'</span>';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seed=[{id:1,title:'Love',speaker:'Sujal Gohel',day:'1',topic:'Love lecture',points:[
{t:'BAPS',c:['Yuva for protect ourself','Not for protest']},
{t:'Love is like liquor',c:[]},
{t:'Prem',c:['Attention, not attraction','Sacrifice']}],key:'Love is freedom|Not a barrier.'}];
function load(){try{const r=localStorage.getItem('lecnotes');if(r)return JSON.parse(r)}catch(e){}return seed}
function save(){try{localStorage.setItem('lecnotes',JSON.stringify(notes))}catch(e){}}
let notes=load(),view='list',cur=null,draft=null,q='';
const app=document.getElementById('app');
const lbl='block text-[10px] font-semibold text-gray-500 uppercase tracking-widest mb-1.5';
const inpC='w-full p-2.5 pr-8 bg-white border border-gray-200 rounded-md text-sm outline-none transition-colors text-gray-900';
const btnP='bg-brand text-white active:bg-[#4a2626] transition-colors rounded-md font-semibold text-sm';
const btnS='bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 rounded-md font-semibold text-sm';
const field=(k,v,ph)=>`<div class="relative min-w-0"><input data-k="${k}" value="${esc(v)}" placeholder="${ph}" class="${inpC}"><button type="button" data-clr class="${v?'':'hidden'} absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700">${I('x','w-3.5 h-3.5')}</button></div>`;
const ini=s=>(s||'N').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();

function rows(){
  const f=notes.filter(n=>(n.title+n.speaker+n.topic).toLowerCase().includes(q.toLowerCase()));
  if(!f.length)return `<div class="px-3 py-8 text-center text-sm text-gray-500">No notes found</div>`;
  return f.map(n=>`<button data-open="${n.id}" class="w-full flex items-center gap-3 px-3 py-3 border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors text-left">
  <span class="font-inter w-8 h-8 rounded-full bg-gray-100 text-gray-600 text-[11px] font-semibold flex items-center justify-center shrink-0">${esc(ini(n.speaker))}</span>
  <span class="min-w-0 flex-1"><span class="block text-sm font-semibold truncate">${esc(n.title||'Untitled')}</span>
  <span class="block text-xs text-gray-500 truncate mt-1">Day <span class="font-inter">${esc(n.day)}</span> · ${esc(n.speaker)}${n.topic?' · '+esc(n.topic):''}</span></span>
  <span class="text-gray-400">${I('next')}</span></button>`).join('');
}
function renderList(){
  app.innerHTML=`<div class="flex items-center justify-between mb-4"><div class="flex items-center gap-2.5 min-w-0">${LOGO}<div><div class="${lbl} !mb-1">Lecture notes</div><h1 class="text-lg font-semibold">My notes</h1></div></div>
  <span class="font-inter text-xs text-gray-500">${notes.length} total</span></div>
  <div class="relative mb-3"><span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400">${I('search')}</span>
  <input data-k="q" value="${esc(q)}" placeholder="Search notes" class="${inpC} !pl-9"><button type="button" data-clr class="${q?'':'hidden'} absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700">${I('x','w-3.5 h-3.5')}</button></div>
  <div id="rows" class="bg-white border border-gray-200 rounded-lg shadow-flat overflow-hidden">${rows()}</div>
  <button data-new aria-label="New note" class="fixed right-4 w-12 h-12 ${btnP} !rounded-lg flex items-center justify-center" style="bottom:calc(env(safe-area-inset-bottom,0px) + 16px)">${I('plus','w-5 h-5')}</button>`;
}
function renderView(){
  const n=notes.find(x=>x.id===cur);if(!n){view='list';return render()}
  const [k1,k2]=(n.key||'').split('|');
  app.innerHTML=`<div class="flex items-center justify-between mb-4">
  <button data-back class="${btnS} h-9 px-3 flex items-center gap-1">${I('back')}Back</button>
  <button data-edit class="${btnS} h-9 px-3 flex items-center gap-1.5">${I('edit')}Edit</button></div>
  <div class="bg-white border border-gray-200 rounded-lg shadow-flat p-4">
  <div class="${lbl} !mb-2">Day <span class="font-inter">${esc(n.day)}</span>${n.topic?' · '+esc(n.topic):''}</div>
  <h1 class="text-xl font-semibold break-words">${esc(n.title)}</h1>
  <div class="text-xs text-gray-500 mt-1.5">${esc(n.speaker)}</div>
  <div class="mt-5 space-y-4">${n.points.map(p=>`<div class="min-w-0"><div class="flex items-start gap-2 text-sm font-medium">${I('arrow','w-3.5 h-3.5 mt-0.5 text-brand')}<span class="min-w-0 break-words">${esc(p.t)}</span></div>
  ${p.c.length?`<div class="ml-1.5 mt-2 pl-4 border-l border-gray-200 space-y-2">${p.c.map(c=>`<div class="flex items-start gap-2 text-sm text-gray-700">${I('arrow','w-3.5 h-3.5 mt-0.5 text-gray-400')}<span class="min-w-0 break-words">${esc(c)}</span></div>`).join('')}</div>`:''}</div>`).join('')}</div>
  ${k1?`<div class="mt-6 pt-5 border-t border-gray-100"><div class="text-lg font-semibold break-words">${esc(k1)}</div><div class="text-lg text-gray-500 break-words">${esc(k2||'')}</div></div>`:''}</div>`;
}
function renderEdit(){
  const d=draft,[k1,k2]=(d.key||'').split('|');
  app.innerHTML=`<div class="flex items-center justify-between mb-4"><h1 class="text-lg font-semibold">${d.isNew?'New note':'Edit note'}</h1>
  <button data-cancel class="${btnS} h-9 px-3">Cancel</button></div>
  <div class="bg-white border border-gray-200 rounded-lg shadow-flat p-4 space-y-4">
  <div><label class="${lbl}">Title</label>${field('title',d.title,'e.g. Love')}</div>
  <div class="grid grid-cols-3 gap-3"><div class="col-span-2 min-w-0"><label class="${lbl}">Speaker</label>${field('speaker',d.speaker,'Speaker name')}</div>
  <div class="min-w-0"><label class="${lbl}">Day</label>${field('day',d.day,'1')}</div></div>
  <div><label class="${lbl}">Topic</label>${field('topic',d.topic,'Lecture topic')}</div>
  <div><label class="${lbl}">Points</label><div class="space-y-3">${d.points.map((p,i)=>`<div class="border border-gray-200 rounded-md p-2.5 space-y-2 bg-gray-50">
  <div class="flex gap-2"><div class="flex-1 min-w-0">${field('p:'+i,p.t,'Main point')}</div><button data-delp="${i}" class="${btnS} w-9 flex items-center justify-center text-gray-500" aria-label="Delete point">${I('trash')}</button></div>
  ${p.c.map((c,j)=>`<div class="flex gap-2 pl-4 border-l border-gray-300"><div class="flex-1 min-w-0">${field('c:'+i+':'+j,c,'Sub-point')}</div><button data-delc="${i}:${j}" class="${btnS} w-9 flex items-center justify-center text-gray-500" aria-label="Delete sub-point">${I('x')}</button></div>`).join('')}
  <button data-addc="${i}" class="text-xs font-semibold text-brand flex items-center gap-1">${I('plus','w-3.5 h-3.5')}Sub-point</button></div>`).join('')}</div>
  <button data-addp class="${btnS} w-full h-9 mt-3 flex items-center justify-center gap-1.5">${I('plus')}Add point</button></div>
  <div><label class="${lbl}">Key line</label><div class="space-y-2">${field('k1',k1||'','e.g. Love is freedom')}${field('k2',k2||'','e.g. Not a barrier.')}</div></div>
  <div class="flex gap-2 pt-1"><button data-save class="${btnP} flex-1 h-10">Save note</button>${d.isNew?'':`<button data-del class="${btnS} h-10 px-3 text-red-700 flex items-center gap-1.5">${I('trash')}Delete</button>`}</div></div>`;
}
function render(){({list:renderList,view:renderView,edit:renderEdit})[view]();window.scrollTo(0,0)}
function setK(k,v){
  if(k==='q'){q=v;document.getElementById('rows').innerHTML=rows();return}
  if(k==='k1'||k==='k2'){let [a,b]=(draft.key||'').split('|');if(k==='k1')a=v;else b=v;draft.key=(a||'')+'|'+(b||'');return}
  if(k[0]==='p'){draft.points[+k.split(':')[1]].t=v;return}
  if(k[0]==='c'){const[,i,j]=k.split(':');draft.points[+i].c[+j]=v;return}
  draft[k]=v;
}
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||t.dataset.k===undefined)return;
  setK(t.dataset.k,t.value);
  const b=t.nextElementSibling;if(b)b.classList.toggle('hidden',!t.value);
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if('clr' in d){const i=b.previousElementSibling;i.value='';i.dispatchEvent(new Event('input',{bubbles:true}));b.classList.add('hidden');i.focus();return}
  if(d.open){cur=+d.open;view='view'}
  else if('new' in d){draft={id:Date.now(),isNew:true,title:'',speaker:'',day:String(notes.length+1),topic:'',points:[{t:'',c:[]}],key:''};view='edit'}
  else if('back' in d||('cancel' in d&&draft.isNew)){view='list'}
  else if('cancel' in d){view='view'}
  else if('edit' in d){draft=JSON.parse(JSON.stringify(notes.find(n=>n.id===cur)));view='edit'}
  else if('addp' in d)draft.points.push({t:'',c:[]});
  else if(d.addc!==undefined)draft.points[+d.addc].c.push('');
  else if(d.delp!==undefined)draft.points.splice(+d.delp,1);
  else if(d.delc!==undefined){const[i,j]=d.delc.split(':');draft.points[+i].c.splice(+j,1)}
  else if('save' in d){
    const n={...draft};delete n.isNew;
    n.points=n.points.map(p=>({t:p.t.trim(),c:p.c.map(c=>c.trim()).filter(Boolean)})).filter(p=>p.t||p.c.length);
    if(!n.title.trim())n.title='Untitled';
    if(draft.isNew)notes.unshift(n);else notes=notes.map(x=>x.id===n.id?n:x);
    save();cur=n.id;view='view'}
  else if('del' in d){if(!confirm('Delete this note?'))return;notes=notes.filter(n=>n.id!==cur);save();view='list'}
  else return;
  render();
});
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
